version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - VITE_HUB_ORIGIN=${VITE_HUB_ORIGIN:-https://lillskolan.se}
        - VITE_LESSON_ORIGIN=${VITE_LESSON_ORIGIN:-https://lillskolan.se}
        - VITE_LESSON_ENTRY=${VITE_LESSON_ENTRY:-/lesson/}
    ports:
      - "80:80"