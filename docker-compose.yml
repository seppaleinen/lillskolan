version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
      - "5174:5174"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_HUB_ORIGIN=http://localhost:5173
      - VITE_LESSON_ORIGIN=http://localhost:5174
    stdin_open: true
    tty: true

volumes:
  node_modules: